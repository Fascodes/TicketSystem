spring.application.name=ticketSystem

# Local env file (gitignored). Real OS env variables take precedence over it.
spring.config.import=optional:file:.env[.properties]

# Datasource [SECRET: from env]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# JWT [SECRET: key files from env]
app.jwt.private-key=file:${JWT_PRIVATE_KEY_PATH}
app.jwt.public-key=file:${JWT_PUBLIC_KEY_PATH}
app.jwt.key-id=${JWT_KEY_ID}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.access-ttl=10m
app.jwt.refresh-ttl=14d
