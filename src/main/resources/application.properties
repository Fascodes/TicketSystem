spring.application.name=ticketSystem

# Local env file (gitignored). Real OS env variables take precedence over it.
spring.config.import=optional:file:.env[.properties]

# Datasource [SECRET: from env]
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# JWT [SECRET: key files from env] - {kid}.private.pem / {kid}.public.pem, see JwtKeyConfig
app.jwt.keys-dir=${JWT_KEYS_DIR}
app.jwt.active-key-id=${JWT_KEY_ID}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.access-ttl=10m
app.jwt.refresh-ttl=14d

# CORS + Origin check [CONFIG: from env, no default - app fails to start without it]
# dev: http://localhost:3000,http://localhost:5173  prod: https://twoja-domena.pl
app.allowed-origins=${APP_ALLOWED_ORIGINS}

# Not used - no actuator dependency. If added: expose only health, never publicly the rest.
# management.endpoints.web.exposure.include=health
