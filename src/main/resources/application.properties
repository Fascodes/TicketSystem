spring.application.name=ticketSystem

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5444:pgdb
spring.datasource.username=pguser123
spring.datasource.password=passpg1user

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
